name: Fortran Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "v0.13.0"

      - name: Show tool versions
        run: |
          gfortran --version
          fpm --version

      - name: Verify test data
        run: |
          test -f data/naca0012.csv
          test -d data/phase_2
          test -f data/phase_2/t197R39.csv

      - name: Show discovered test sources
        run: |
          find test -maxdepth 1 -type f -name '*.f90' -print | sort

      - name: Build project
        run: fpm build --profile debug

      - name: Run all tests
        run: fpm test --profile debug
